<text x='4.98' y='27.52' style='font-size: 9.00px;fill: #5B6875; font-family: "Arial";' textLength='400.50px' lengthAdjust='spacingAndGlyphs'>17,181 accepted links, by the evidence class that carried each one. Classes are ordered, not scored:</text>
<text x='4.98' y='40.48' style='font-size: 9.00px;fill: #5B6875; font-family: "Arial";' textLength='346.50px' lengthAdjust='spacingAndGlyphs'>a record resolves only when exactly ONE candidate sits at its strongest available class.</text>
<text x='4.98' y='13.58' style='font-size: 12.00px; font-weight: bold;fill: #111820; font-family: "Arial";' textLength='249.34px' lengthAdjust='spacingAndGlyphs'>What the accepted matches actually rest on</text>
<text x='4.98' y='403.39' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='429.03px' lengthAdjust='spacingAndGlyphs'>Confidence attached to each class in the resolver: class 1 = 1.00 · class 2 = 0.90 · class 3 = 0.70 · class 4 = 0.50 · class 5 = 0.35.</text>
<text x='4.98' y='415.54' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='436.50px' lengthAdjust='spacingAndGlyphs'>Class 3 is a first-initial rule, NOT a nickname dictionary -- same surname, same first letter, different given name. It generates 76% of</text>
<text x='4.98' y='427.69' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='449.78px' lengthAdjust='spacingAndGlyphs'>the candidate universe and the widest ties (348-way on one SMITH), so what survives ranking here is a small remainder of a large pool.</text>
<text x='4.98' y='439.84' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='441.00px' lengthAdjust='spacingAndGlyphs'>A nursing-taxonomy accept at class 3 or below is two sensitivity decisions stacked. Source: artifacts/amcb_npi_linkage_FROZEN.csv</text>
