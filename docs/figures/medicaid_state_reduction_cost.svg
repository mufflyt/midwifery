<text x='6.48' y='34.05' style='font-size: 9.30px; font-family: "Arial";' textLength='568.17px' lengthAdjust='spacingAndGlyphs'>Asked whether a midwife is enrolled in Medicaid somewhere CMS's directory lists her, the answer barely moves with how many states she</text>
<text x='6.48' y='47.45' style='font-size: 9.30px; font-family: "Arial";' textLength='564.09px' lengthAdjust='spacingAndGlyphs'>works in. Asked whether her LARGEST Medicaid state is one of them, it falls away -- because reducing a multi-state provider to one state</text>
<text x='6.48' y='60.84' style='font-size: 9.30px; font-family: "Arial";' textLength='142.66px' lengthAdjust='spacingAndGlyphs'>is a choice the comparison makes.</text>
<text x='6.48' y='17.64' style='font-size: 15.60px; font-family: "Arial";' textLength='309.39px' lengthAdjust='spacingAndGlyphs'>Same records, two questions, a 38-point gap</text>
<text x='605.52' y='383.30' text-anchor='end' style='font-size: 10.40px; font-family: "Arial";' textLength='572.17px' lengthAdjust='spacingAndGlyphs'>artifacts/medicaid_vs_ndh_state_reduction.csv; counts below each point are midwives. NDH is treated as a set of states, not</text>
<text x='605.52' y='394.54' text-anchor='end' style='font-size: 10.40px; font-family: "Arial";' textLength='541.36px' lengthAdjust='spacingAndGlyphs'>reduced to one; NDH = National Directory of Healthcare Providers; CMS = Centers for Medicare &amp; Medicaid Services.</text>
