<text x='4.98' y='27.05' style='font-size: 9.00px;fill: #5B6875; font-family: "Arial";' textLength='385.83px' lengthAdjust='spacingAndGlyphs'>Dashed line is the share observed among the 16,636 cohort members with an assignable county.</text>
<text x='4.98' y='39.47' style='font-size: 9.00px;fill: #5B6875; font-family: "Arial";' textLength='332.50px' lengthAdjust='spacingAndGlyphs'>Intervals are roster-wide and make no assumption about why geography is missing.</text>
<text x='4.98' y='13.21' style='font-size: 11.50px; font-weight: bold;fill: #111820; font-family: "Arial";' textLength='378.14px' lengthAdjust='spacingAndGlyphs'>Metropolitan share: what the located cohort licenses about the roster</text>
<text x='4.98' y='245.44' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='341.28px' lengthAdjust='spacingAndGlyphs'>Discarding the 1,376 non-cohort certificants whose ZIP does resolve widens the interval without adding</text>
<text x='4.98' y='256.24' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='344.28px' lengthAdjust='spacingAndGlyphs'>caution; they are 87.9% metropolitan, below the cohort rather than above it. For the roster-wide share to</text>
<text x='4.98' y='267.04' style='font-size: 7.50px;fill: #5B6875; font-family: "Arial";' textLength='302.23px' lengthAdjust='spacingAndGlyphs'>reach 75%, the unobserved would have to be 32.7% metropolitan -- a 56.7-point departure.</text>
