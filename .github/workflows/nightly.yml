# =============================================================================
# Nightly full-repository integrity audit
# =============================================================================
# ci.yml runs a fast curated subset on every push. This is the full audit, and
# it is deliberately allowed to be expensive.
#
# A green run here is a claim about the whole repository: it is syntactically
# valid, its tests are DISCOVERED rather than remembered, its deterministic
# logic still holds, its frozen provenance still verifies, its public surface
# exposes no person-level data or credentials, and every blocking check
# actually reached completion. A green run is NOT the weaker claim that "the
# tests someone thought to name in a workflow passed" -- 21 of 67 test files
# were in exactly that position before this workflow existed.
#
# Discovery is a contract
# -----------------------
# Every tests/test*.R and tests/test*.py enters this workflow automatically.
# The ONLY way a discovered test is treated differently is an entry in
# tests/ci_nightly_exceptions.txt, which lists exceptions and never normal
# tests, and which tests/ci_nightly_registry_check.R holds to its own gates.
#
# Blocking vs informational
# -------------------------
# Blocking  = this repository cannot currently be trusted.
# Informational = a third party is down. Reported, never red.
# A nightly that is permanently red for someone else's outage gets muted, and
# a muted nightly protects nothing.
#
# Schedule
# --------
# 05:17 UTC = 23:17 America/Denver during MDT, 22:17 during MST. GitHub Actions
# cron has no timezone support -- there is no TZ field to set -- so one of the
# two is an hour off; 23:17 is correct for the larger part of the year.
# Scheduled runs are queued rather than punctual and can drift several minutes.
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# One nightly per ref. A manual dispatch supersedes a running nightly rather
# than racing it for the same caches.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. This workflow observes; it must never push, retag,
# rewrite a baseline, refreeze a cohort, or touch a provenance manifest. Only
# the notification job is granted more, and only issues: write.
permissions:
  contents: read

env:
  R_KEEP_PKG_SOURCE: no

jobs:
  # ===========================================================================
  # BLOCKING
  # ===========================================================================

  # Every tests/*.R except registry exceptions. Continues past a failure so one
  # broken suite cannot hide the state of the other 55 -- the tally is the
  # result, not the first red line.
  r-suite:
    name: R suite (all discovered)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history, not the default depth 1. test_amcb_gates.R proves its G1
      # gate would have caught commit a8552fa, which published a crosswalk with
      # three columns its own matcher could not produce. In a shallow clone that
      # commit is absent, `git show` returns nothing, and the negative control
      # reported a FAILURE instead of being unreachable -- a gate whose proof
      # of working silently stopped working.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-nightly-${{ hashFiles('.github/workflows/nightly.yml') }}
          restore-keys: ${{ runner.os }}-r-nightly-

      # ci.yml deliberately refuses the geo stack to stay hermetic and fast.
      # The nightly is where the spatial suites actually get to run, so the
      # system libraries sf links against are installed here and nowhere else.
      - name: System libraries for sf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      # The superset: what the tests name, plus everything reached through
      # source() chains. A package missing here reads as a test failure, which
      # is why this list is generous rather than minimal.
      - name: Install packages
        run: |
          pkgs <- c("dplyr", "jsonlite", "purrr", "readr", "scales", "stringi",
                    "stringr", "testthat", "tibble", "tidyr",
                    "checkmate", "DBI", "digest", "duckdb", "geosphere",
                    "here", "httr", "openssl", "xml2",
                    "assertthat", "withr", "fs", "rlang", "readxl",
                    "stringdist", "humaniformat", "sf")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE))
            stop("package still unavailable after install: ", p)
        shell: Rscript {0}

      # Two harnesses live in tests/. 13 files use testthat and must go through
      # test_file(); the other 44 are standalone scripts with their own harness
      # and exit code. Dispatch on CONTENT, not filename: test-*.R is testthat
      # but so are test_invariants_midwifery.R, test_pip_materialization.R and
      # test_cross_taxonomy_hierarchy.R. Running a testthat file with plain
      # Rscript fails with "could not find function test_that", which reads
      # like a broken test rather than a broken runner.
      - name: Run every discovered tests/*.R
        run: |
          set -u
          sed -e 's/#.*$//' tests/ci_nightly_exceptions.txt \
            | awk 'NF {print $1}' > /tmp/exceptions.txt
          pass=0; fail=0; skipped=0; failed=""
          for t in tests/test*.R; do
            b=$(basename "$t")
            case "$b" in helper-*) continue;; esac
            if grep -qxF "$t" /tmp/exceptions.txt; then
              skipped=$((skipped+1)); echo "REGISTRY-EXCEPTION $b"; continue
            fi
            echo "::group::$b"
            # Match a real CALL SITE, not a mention. ci_mutation_testing.R
            # contains the literal "test_that(" inside a string and was
            # dispatched to testthat, which resolved its root differently and
            # failed looking for tests/tests/mutation_catalogue.R.
            if grep -qE '^[[:space:]]*test_that\(' "$t"; then
              ok=0; Rscript -e "testthat::test_file('$t',stop_on_failure=TRUE)" || ok=$?
            else
              ok=0; Rscript "$t" || ok=$?
            fi
            if [ "$ok" -eq 0 ]; then pass=$((pass+1)); echo "PASS $b"
            else fail=$((fail+1)); failed="$failed $b"; echo "FAIL $b"; fi
            echo "::endgroup::"
          done
          {
            echo "## R suite"
            echo "- $pass passed, $fail failed, $skipped registry exceptions"
            [ "$fail" -gt 0 ] && for f in $failed; do echo "  - FAIL \`$f\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] || { echo "FAILED:$failed"; exit 1; }

  # ---------------------------------------------------------------------------
  python-suite:
    name: Python suite (all discovered)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Compiling every tracked .py catches a syntax error in a script that no
      # test imports -- which is most of them.
      - name: Compile all tracked Python
        run: |
          git ls-files '*.py' | tr '\n' '\0' | xargs -0 -n50 python -m py_compile
          echo "- compiled $(git ls-files '*.py' | wc -l) tracked Python files" >> "$GITHUB_STEP_SUMMARY"

      - name: Run every discovered tests/*.py
        run: |
          ls tests/*.py >/dev/null 2>&1 || { echo "no python tests"; exit 0; }
          python -m pytest tests/ -v --tb=short -p no:cacheprovider

  # ---------------------------------------------------------------------------
  gates:
    name: Integrity, leak and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # The gates reach further than their own source suggests: ci_repo_integrity.R
      # pulls scales through a helper chain, which failed the first nightly with
      # "there is no package called 'scales'". Install the same superset the R
      # suite does rather than guessing a minimal set again.
      - name: Install packages
        run: |
          pkgs <- c("dplyr", "readr", "stringr", "jsonlite", "digest", "fs",
                    "rlang", "tibble", "tidyr", "purrr", "checkmate", "scales",
                    "stringi", "withr", "assertthat", "here")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE))
            stop("package still unavailable after install: ", p)
        shell: Rscript {0}

      - name: Leak guard (person-level columns, file size)
        if: always()
        run: Rscript tests/ci_leak_guard.R

      - name: Nightly exception registry
        if: always()
        run: Rscript tests/ci_nightly_registry_check.R

      # DEBT.md is a hand-maintained list whose whole value is being accurate,
      # which is the same shape of object as the rebuild order that silently
      # omitted five FROZEN consumers. It gets the same treatment.
      - name: Known-debt register
        if: always()
        run: Rscript tests/ci_debt_check.R

      - name: Repo hygiene
        if: always()
        run: Rscript tests/ci_hygiene.R

      - name: Repository integrity gates
        if: always()
        run: Rscript tests/ci_repo_integrity.R

      - name: Artifact contracts
        if: always()
        run: Rscript tests/ci_artifact_contracts.R

      - name: Semantic contracts
        if: always()
        run: Rscript tests/ci_semantic_contracts.R

  # ---------------------------------------------------------------------------
  # Does the suite DETECT anything? Every other job asks whether the code is
  # right. This one introduces plausible bugs and checks the tests turn red.
  # A mutation that SURVIVES is a hole in the tests, and it fails this job.
  #
  # Runs a rotating slice so a nightly stays minutes rather than an hour; the
  # whole catalogue cycles over successive days. MUTATION_ALL=1 on a manual
  # dispatch runs everything.
  # ---------------------------------------------------------------------------
  mutation-testing:
    name: Mutation testing (does the suite detect anything?)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System libraries for sf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Install packages
        run: |
          pkgs <- c("dplyr", "jsonlite", "purrr", "readr", "scales", "stringi",
                    "stringr", "testthat", "tibble", "tidyr", "checkmate",
                    "DBI", "digest", "duckdb", "geosphere", "here", "httr",
                    "openssl", "xml2", "assertthat", "withr", "fs", "rlang",
                    "readxl", "stringdist", "humaniformat", "sf")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
        shell: Rscript {0}

      - name: Introduce plausible bugs and require the tests to catch them
        run: Rscript tests/ci_mutation_testing.R

      # The runner restores every file it mutates and verifies this itself, but
      # a mutation escaping into a later job would be far worse than a failed
      # build, so the workspace is checked independently here too.
      - name: The workspace must be unmodified
        if: always()
        run: |
          git diff --quiet || {
            echo "MUTATION ESCAPED -- working tree is dirty:"; git diff --stat; exit 1; }
          echo "workspace clean; no mutation escaped"

  # ---------------------------------------------------------------------------
  suite-coverage:
    name: No test file goes unrun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # FATAL: the nightly must keep DISCOVERING. If the glob is ever replaced
      # by an enumeration, coverage silently reverts to whatever that list
      # happens to name -- the exact failure that left 21 files unrun.
      - name: Nightly must still discover tests by glob
        run: |
          grep -q 'for t in tests/test\*\.R' .github/workflows/nightly.yml \
            || { echo "nightly.yml no longer globs tests/test*.R"; exit 1; }
          grep -q 'pytest tests/' .github/workflows/nightly.yml \
            || { echo "nightly.yml no longer runs the pytest directory"; exit 1; }
          echo "nightly still discovers tests by glob"

      # FATAL: a test that is neither discovered nor registered is a test
      # nobody runs. This is the check that would have caught the original 21.
      - name: Every test is either run or registered
        run: |
          set -u
          sed -e 's/#.*$//' tests/ci_nightly_exceptions.txt \
            | awk 'NF {print $1}' > /tmp/exceptions.txt
          orphans=""
          for t in tests/test*.R tests/test*.py; do
            [ -e "$t" ] || continue
            b=$(basename "$t")
            case "$b" in helper-*) continue;; esac
            grep -qxF "$t" /tmp/exceptions.txt && continue
            # Discovered by the r-suite glob (*.R) or the pytest directory (*.py).
            case "$t" in tests/*.R|tests/*.py) continue;; esac
            orphans="$orphans $b"
          done
          [ -z "$orphans" ] || { echo "unrun and unregistered:$orphans"; exit 1; }
          echo "every test is discovered or registered"

      # FATAL: narrowing r-suite to tests/test*.R means the ci_*.R gates are no
      # longer swept up by the glob -- they are named explicitly in `gates` and
      # `mutation-testing`. That is deliberate (running the mutation runner
      # inside the suite it mutates is actively wrong), but it creates a new way
      # to orphan a gate, so the gates are policed here too.
      - name: Every ci_*.R gate is named by some job
        run: |
          set -u
          # ci_report.R defines the shared reporter and is SOURCED by the gates,
          # never run standalone -- the same category as helper-*.R.
          orphans=""
          for f in tests/ci_*.R; do
            b=$(basename "$f")
            [ "$b" = "ci_report.R" ] && continue
            grep -q "$b" .github/workflows/nightly.yml || orphans="$orphans $b"
          done
          [ -z "$orphans" ] || { echo "gates no job runs:$orphans"; exit 1; }
          echo "every ci_*.R gate is named by a job"

      # INFORMATIONAL: which tests the fast per-push CI does not name. Covered
      # nightly, so this is a latency report -- a bug in one of them surfaces
      # within a day rather than within a push.
      - name: Report tests not covered by the per-push CI
        run: |
          n_all=0; n_gap=0; gap=""
          for t in tests/test*.R tests/test*.py; do
            [ -e "$t" ] || continue
            b=$(basename "$t")
            case "$b" in helper-*) continue;; esac
            n_all=$((n_all+1))
            grep -q "$b" .github/workflows/ci.yml || { n_gap=$((n_gap+1)); gap="$gap $b"; }
          done
          {
            echo "## Test coverage"
            echo "- $n_all test files, all discovered nightly"
            echo "- $n_gap not named by ci.yml (nightly-only):"
            for g in $gap; do echo "  - \`$g\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The repository is PUBLIC. This job is about what a stranger can read.
  # ---------------------------------------------------------------------------
  public-exposure:
    name: Public exposure audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: No credential-shaped strings
        if: always()
        run: |
          # The pattern is assembled from fragments so that this file does not
          # match itself. The first nightly failed on exactly that: the regex
          # literal in nightly.yml:300 was reported as a possible credential.
          # Excluding .github/ instead would create a blind spot in the one
          # directory that legitimately handles secrets.
          pat="$(printf '%s' 'aws_secret_' 'access_key')"
          pat="$pat|-----BEGIN [A-Z ]*PRIVATE KEY-----"
          pat="$pat|$(printf '%s' 'gh' 'p_')[A-Za-z0-9]{30,}"
          pat="$pat|$(printf '%s' 'xox' '[baprs]-')[A-Za-z0-9-]{10,}"
          if git ls-files -z | xargs -0 grep -n -E "$pat" 2>/dev/null > /tmp/sec.txt; then
            if [ -s /tmp/sec.txt ]; then
              echo "Possible credential in a tracked file:"; cat /tmp/sec.txt; exit 1
            fi
          fi
          echo "no credential-shaped strings in tracked files"

      - name: Tracked CSVs must not name people
        if: always()
        run: |
          # A second opinion on the leak guard, keyed on SIZE and column names
          # rather than the guard's column list alone. It reads the SAME
          # baseline: a checker with its own private allowlist is how one file
          # ends up red in one job and green in another.
          sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' \
              tests/ci_leak_baseline.txt | sed '/^#/d' > /tmp/leak_baseline.txt
          bad=0
          for f in $(git ls-files '*.csv'); do
            grep -qxF "$f" /tmp/leak_baseline.txt && continue
            rows=$(wc -l < "$f" 2>/dev/null || echo 0)
            [ "$rows" -gt 500 ] || continue
            if head -1 "$f" | grep -qiE '(^|,)(npi|candidate_npi|roster_last|last_name)(,|$)'; then
              echo "large tracked CSV with an identity column: $f ($rows rows)"; bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "no large tracked CSV carries an identity column"
          exit $bad

      - name: Report tracked absolute home paths
        if: always()
        run: |
          # Reported, not fatal: tests/ci_integrity_abs_path_baseline.txt governs
          # this and ci_repo_integrity.R is what fails the build. Duplicating the
          # verdict here would mean two jobs disagreeing about one baseline.
          git ls-files -z | xargs -0 grep -l -E '/Users/[a-z]+/|/home/[a-z]+/' 2>/dev/null \
            | grep -vE '^(tests/ci_integrity_abs_path_baseline\.txt|\.github/)' > /tmp/abs.txt || true
          if [ -s /tmp/abs.txt ]; then
            { echo "## Tracked files with an absolute home path"; sed 's/^/- /' /tmp/abs.txt; } \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no tracked absolute home paths outside the baseline"
          fi

  # ===========================================================================
  # INFORMATIONAL -- a third party being down is not this repository failing
  # ===========================================================================

  network-tests:
    name: Network-dependent tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install packages
        run: |
          pkgs <- c("dplyr", "readr", "stringr", "tibble", "tidyr", "purrr",
                    "checkmate", "jsonlite", "httr", "digest", "scales")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
        shell: Rscript {0}

      - name: Run external-network registry entries
        run: |
          set -u
          sed -e 's/#.*$//' tests/ci_nightly_exceptions.txt \
            | awk '$2 == "external-network" {print $1}' > /tmp/net.txt
          fail=0
          while read -r t; do
            [ -n "$t" ] || continue
            echo "::group::$(basename "$t")"
            if Rscript "$t"; then echo "PASS $t"
            else fail=$((fail+1)); echo "UPSTREAM-FAIL $t"
                 echo "- upstream failure: \`$t\`" >> "$GITHUB_STEP_SUMMARY"; fi
            echo "::endgroup::"
          done < /tmp/net.txt
          [ "$fail" -eq 0 ] && echo "all upstream sources reachable"
          exit 0

  # ---------------------------------------------------------------------------
  external-deps:
    name: Private-dependency tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # These need ~/isochrones/R/string_normalization.R. mufflyt/isochrones is
      # PRIVATE and this repository is PUBLIC, so a runner has no credentials
      # for it. Reported so the gap stays visible instead of being forgotten.
      - name: Report tests blocked on a private sibling repository
        run: |
          sed -e 's/#.*$//' tests/ci_nightly_exceptions.txt \
            | awk '$2 == "external-private" {print $1}' > /tmp/priv.txt
          n=$(wc -l < /tmp/priv.txt | tr -d ' ')
          {
            echo "## Blocked on a private dependency ($n)"
            echo "mufflyt/isochrones is private; this public runner cannot clone it."
            echo "Add a read-only deploy key as a secret to make these blocking."
            sed 's/^/- `/; s/$/`/' /tmp/priv.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/priv.txt

  # ===========================================================================
  summary:
    name: Nightly summary
    runs-on: ubuntu-latest
    # Blocking jobs only. network-tests and external-deps are informational by
    # construction and must not be able to redden the nightly.
    needs: [r-suite, python-suite, gates, suite-coverage, public-exposure, mutation-testing]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "| blocking job | result |"
            echo "| --- | --- |"
            echo "| R suite | ${{ needs.r-suite.result }} |"
            echo "| Python suite | ${{ needs.python-suite.result }} |"
            echo "| Gates | ${{ needs.gates.result }} |"
            echo "| Suite coverage | ${{ needs.suite-coverage.result }} |"
            echo "| Public exposure | ${{ needs.public-exposure.result }} |"
            echo "| Mutation testing | ${{ needs.mutation-testing.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A skipped or cancelled blocking job is NOT a pass. Requiring 'success'
      # explicitly means a cancelled run cannot be mistaken for a green one.
      - name: Every blocking job must have succeeded
        run: |
          for r in "${{ needs.r-suite.result }}" \
                   "${{ needs.python-suite.result }}" \
                   "${{ needs.gates.result }}" \
                   "${{ needs.suite-coverage.result }}" \
                   "${{ needs.public-exposure.result }}" \
                   "${{ needs.mutation-testing.result }}"; do
            [ "$r" = "success" ] || { echo "blocking job result: $r"; exit 1; }
          done
          echo "all blocking jobs succeeded"
