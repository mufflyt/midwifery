# =============================================================================
# CI: the checks that can run without the data
# =============================================================================
# DELIBERATELY SMALL. Almost every test in tests/ loads a multi-megabyte
# artifact, and several reach outside the repo entirely -- the name-normalisation
# tests need ~/isochrones, the linkage tests need a 22,309-row FROZEN crosswalk
# that is gitignored because it is person-level. None of that exists on a runner,
# so CI runs the subset that is genuinely hermetic and says nothing about the
# rest. A green tick here means "the keys and the syntax are sound", NOT "the
# pipeline is correct", and it must not be read as the latter.
#
# Three jobs, deliberately tiered by what they cost to install:
#
#   r-checks       base R + stringr. Seconds. Hygiene and the join keys.
#   python-checks  stdlib + pytest. Seconds. Syntax, address keys, scraper logic.
#   r-unit-tests   the tidyverse stack. A minute or two, cached. Pure-function
#                  tests that happen to be written against dplyr.
#
# The tiering is the point. The first two must stay trivially cheap so they are
# never the reason someone switches CI off; the third is allowed to cost more
# because it can be disabled on its own without taking the fast checks with it.
# What NONE of them may do is install sf or system geo libraries. A twenty-minute
# CI that builds GDAL to check a string function goes red for an unrelated reason
# in week one and gets switched off in week two.
#
# Before adding a test here, verify it is hermetic the way the existing ones were
# verified -- run it in a fresh `git clone` of HEAD, which has no gitignored
# artifacts and no ~/isochrones. Passing locally proves nothing; your working
# tree has the data.
#
# A FRESH CLONE IS NOT ENOUGH ON ITS OWN. It proves no missing FILE; it says
# nothing about a missing PACKAGE, because your R library still has everything
# you have ever installed. Seventeen suites were added here having passed a
# fresh-clone check and CI still went red on the first step, on a package the
# runner does not install. Check both:
#
#   files    fresh `git clone` + HOME redirected to an empty dir
#   packages follow every source() chain -- including the
#            source(file.path(root, ...)) forms a naive grep misses -- and
#            confirm each package it reaches is in the install list below
#   /tmp     grep the suite for absolute paths outside the repo. A stale file
#            in /tmp is invisible to a fresh clone and survives a HOME
#            redirect; cycle6 passed locally for exactly that reason and went
#            red here. Absent-input branches must SKIP loudly or the suite does
#            not belong in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  r-checks:
    name: R hygiene and join keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # stringr only. Both files under test are dependency-light on purpose;
      # if this list grows, the thing being tested has stopped being hermetic.
      - name: Install stringr
        run: install.packages("stringr")
        shell: Rscript {0}

      # Runs first: a parse failure makes every later result meaningless.
      - name: Repo hygiene (parse, foreign paths, ignore rules, duplicate helpers)
        run: Rscript tests/ci_hygiene.R

      # PR #100 spent a full red CI round trip on `Rscript: command not found`
      # because two R steps were added to the Python job. Base R, under a
      # second, and it fails on exactly that. Placed in this job because this
      # job is the cheap one -- a workflow defect should not wait behind a
      # two-minute test suite to be reported.
      - name: Workflow contracts (a job installs what it runs)
        run: Rscript tests/ci_workflow_contracts.R

      # The aggregate gate decides whether this pull request is scientifically
      # green, so its logic is tested here rather than trusted: all-success
      # passes, and skipped, cancelled, failed, missing and ran-nothing are each
      # refused BY KIND. It also parses this file and fails if a job exists that
      # the gate neither depends on nor requires.
      - name: Aggregate scientific gate (self-test)
        run: Rscript tests/test_aggregate_gate.R


      - name: Join-key unit tests
        run: Rscript tests/test_lib_keys.R

      # safe_divide() refuses a non-numeric argument instead of coercing it to
      # NA, which was indistinguishable from a zero denominator. Base R only,
      # so it belongs in the cheap tier: it costs nothing and it guards the
      # arithmetic under every rate this project publishes.
      - name: safe_divide type validation
        run: Rscript tests/test_safe_divide_types.R

      # Base R only -- table1_bands.R has no library() call at all, so this
      # costs nothing beyond the seconds it runs in. Age, tenure and decade
      # banding decide what Table 1 reports, and an off-by-one boundary here
      # moves published percentages.
      - name: Table 1 banding tests
        run: Rscript tests/test_table1_bands.R

      # The check with the most to prevent. Four commits in one week untracked
      # person-level artifacts one at a time, each found by hand AFTER it was
      # committed. This blocks the next one, caps tracked file size, and holds a
      # baseline of the 67 already in history.
      - name: Leak guard (person-level columns, file size)
        run: Rscript tests/ci_leak_guard.R

      # Reads committed artifacts and asserts what a reader would assume without
      # checking: Table 1 blocks sum to the cohort, a suppressed cell is not a
      # zero, provenance coverage does not regress.
      - name: Artifact contracts
        run: Rscript tests/ci_artifact_contracts.R

      # Invariants about MEANING across artifacts: no numbered stage writes
      # without provenance, no fourth rurality dialect, no percent column on a
      # surprise scale, no geographic id that lost a digit or gained a forged
      # token.
      - name: Semantic contracts
        run: Rscript tests/ci_semantic_contracts.R

      # The join keys, assuming hostile input: missing values that come back
      # looking joinable, spreadsheet damage, prefix collisions, non-Anglo
      # addresses, idempotence and length preservation.
      - name: Adversarial key tests
        run: Rscript tests/test_adversarial_keys.R

      # Runs BEFORE the gates it checks, for the same reason the integrity
      # gate-of-gates does: a science gate with a regex that matches nothing
      # passes exactly like a clean repository. This plants one defect per gate
      # and asserts each is caught, and pins four near-misses that must NOT
      # fail -- both false positives the gates produced on their first run are
      # cases here, so the precision cannot silently regress.
      #
      # It shells out to Rscript once per case in a temporary git repo, so it
      # costs ~90s. That is the whole reason the gates below are trustworthy.
      - name: Science gates detect planted defects
        run: Rscript tests/test_science_contracts_detect.R

      # What neither of the contract files above asks: whether the CODE claims
      # more than the DATA supports. Affiliation never labelled employment,
      # resolution fail-closed, absence not read as a negative from a
      # partial-coverage source, author-chosen cuts declared exploratory, one
      # address normaliser, and independent external sources never pooled into
      # a single verdict.
      #
      # SCI2 carries a baseline of three pre-existing tie-break sites, listed
      # in the file with the reason each is there. The baseline can only
      # shrink: it fails if a fourth appears AND if a baselined one is fixed
      # without being removed from the list.
      - name: Science contracts
        run: Rscript tests/ci_science_contracts.R

  python-checks:
    name: Python syntax and address keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compiles every tracked .py. The scrapers import requests/bs4, which are
      # NOT installed here -- compileall checks syntax without importing, which
      # is the part worth checking on every push.
      - name: Compile all tracked Python
        run: |
          git ls-files '*.py' | tr '\n' '\0' | xargs -0 python -m py_compile
          echo "compiled $(git ls-files '*.py' | wc -l) files"

      # Hermetic: pure string functions, no network, no artifacts, no imports
      # beyond the standard library.
      - name: Address-key matching tests
        run: python3 tests/test_address_key_matching.py

      # pytest is the only install in this job. Both scrape.py and
      # fetch_npi_candidates.py import nothing outside the standard library, and
      # the suites monkeypatch the network layer rather than reaching it.
      - name: Install pytest
        run: python -m pip install --quiet --disable-pip-version-check pytest

      # Covers the two failure modes that silently truncate the roster: the
      # 500-row APEX cap in the directory pager, and the 200-row response cap in
      # the NPI API's candidate lists.
      - name: Scraper and NPI-candidate tests
        run: python -m pytest tests/test_scrape.py tests/test_fetch_npi_candidates.py -q

      # -v so the SKIP REASONS appear in the log. Three of these four tests read
      # a person-level artifact that is gitignored by design and therefore never
      # present in a checkout; without -v the step prints "OK (skipped=3)" and a
      # reader cannot tell a deliberate skip from a test that quietly does
      # nothing. Loud skipping is the contract -- see the header.
      - name: Run Midwifery Pipeline Integration Tests
        run: python3 tests/test_midwifery_pipeline.py -v

      # Workforce microsimulation: the population-conservation contract, found
      # broken and fixed in cycle 24 of the adversarial loop.
      #
      # PYTHON ONLY. This job installs Python and nothing else, so the two R
      # halves of this contract -- the port's cross-implementation agreement and
      # the case library -- live in the R job below. They were originally placed
      # here, beside the Python test they check against, which reads well and
      # exits 127: `Rscript: command not found`. Proximity in the file is not a
      # runtime.
      - name: Microsimulation conservation contract
        run: python3 -m unittest tests.test_cycle24_microsimulation_conservation -v

  # ---------------------------------------------------------------------------
  # The tier that is allowed to cost something.
  #
  # Every test below is a pure-function test -- no artifact, no network, no
  # ~/isochrones -- that happens to be written against dplyr because the rest of
  # the pipeline is. Each was verified in a fresh clone of HEAD before being
  # added here, so a red result means a real regression, not missing data.
  #
  # Packages are cached on the workflow file's hash: the install only re-runs
  # when this list changes.
  # ---------------------------------------------------------------------------
  r-unit-tests:
    name: R unit tests (pure functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-tidy-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-r-tidy-

      # Binary packages from the public RSPM. No compilation, no system geo
      # libraries -- if a package here ever needs one, it does not belong here.
      #
      # The second group is what the sourced helpers pull in, NOT what the tests
      # name directly, which is why they were missed the first time: a test
      # source()s R/join_safety.R, which requires checkmate at source time and
      # stops if it is absent. Grepping the test files alone does not find any
      # of these -- you have to follow the source() chain, including the
      # source(file.path(root, ...)) forms.
      #
      #   checkmate  R/join_safety.R, at source time
      #   digest     artifact SHA-256 checks (provenance wiring)
      #   DBI/duckdb the Type-2 candidate universe query
      #   geosphere  distance checks in the geocode-conflict suite
      #   here/httr/openssl/xml2  reached through the same helper chain
      #
      # None needs GDAL/GEOS/PROJ. xml2, httr and openssl link against libxml2,
      # libcurl and libssl, which are present on ubuntu-latest already -- that
      # is the line: standard system libraries yes, geo stack no.
      - name: Install packages
        run: |
          pkgs <- c("dplyr", "jsonlite", "purrr", "readr", "scales", "stringi",
                    "stringr", "testthat", "tibble", "tidyr",
                    "checkmate", "DBI", "digest", "duckdb", "geosphere",
                    "here", "httr", "openssl", "xml2",
                    # the ported upstream suites: assertthat for their
                    # preconditions, withr for scoped envvars and temp dirs
                    "assertthat", "withr",
                    # the integrity gates, plus two the gates themselves found
                    # undeclared: rlang (R/lib/ct_county_crosswalk.R) and readxl
                    # (R/build_amcb_state_licenses.R). Both resolve today only
                    # by luck.
                    "fs", "rlang", "readxl",
                    # G2 in test_science_invariants.R reaches
                    # name_matches_roster() by sourcing
                    # scrape_healthgrades_midwives.R, which attaches rvest at
                    # the top. Without it the suite dies at G2 and the seven
                    # pinned false matches -- ANDERSON/SANDERSON,
                    # WILLIAMS/WILLIAMSON, MARTIN/MARTINEZ and the rest, each
                    # of which wrote a wrong certificant row in production --
                    # stop being checked on every push.
                    "rvest", "humaniformat")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
        shell: Rscript {0}

      # The deterministic license->NPI bridge: the one linkage path that does not
      # depend on comparing two spellings of a name. Its collision handling is
      # what keeps a shared license key from asserting a shared identity.
      # Belongs in THIS job, not in r-checks. The tiering at the top of this
      # file is deliberate -- r-checks is base R plus stringr and must stay
      # trivially cheap -- and this suite needs dplyr, readr and stringr, which
      # only this job installs. Placed in r-checks it failed with "there is no
      # package called 'dplyr'", which reads as a broken test rather than a
      # step in the wrong tier.
      - name: Science invariants (defects that actually occurred)
        run: Rscript tests/test_science_invariants.R

      - name: AMCB license bridge
        run: Rscript tests/test_amcb_license_bridge.R

      - name: State-license table construction
        run: Rscript tests/test_build_amcb_state_licenses.R

      # Projects the license-bridge crosswalk onto reconcile_linkage.R's
      # npi/npi_match_status vocabulary, so a deterministic license match merges
      # into the matched artifact instead of being mis-bucketed at the seam.
      - name: License-bridge -> reconcile adapter
        run: Rscript tests/test_adapt_license_bridge_to_reconcile.R

      # Former/maiden surnames are how a certificant disappears from the roster
      # without leaving practice; this guards the candidate expansion that finds
      # them again.
      - name: Former-name candidate expansion
        run: Rscript tests/test_expand_former_name_candidates.R

      # Ingest of the external former-name export that feeds the expansion:
      # normalizes any supplied source onto certification_number and proves the
      # attach -> expand handoff end to end.
      - name: Former-name external ingest
        run: Rscript tests/test_load_former_last_names.R

      # Age is imputed against a calibrated model (R2 = 0.550), so the validator
      # that bounds it is load-bearing for every age-banded row in Table 1.
      - name: Age-at-certification validation
        run: Rscript tests/test_validate_age_at_certification.R

      # A nursing-only match must never be promoted into the primary midwifery
      # cohort. This is that rule, as a test.
      - name: Cross-taxonomy hierarchy
        run: Rscript tests/test_cross_taxonomy_hierarchy.R

      # Pass 2 of the Healthgrades sweep checkpoints incrementally; a merge that
      # drops or duplicates rows silently corrupts a seven-hour run.
      - name: Checkpoint merge contract
        run: Rscript tests/test_checkpoint_merge.R

      # A published result may be generated or it may be typed, and not both.
      # Scoped to manuscript/protected_results.tsv -- a registry of results, not
      # a rule against digits, because a checker that is wrong about years and
      # section numbers gets switched off.
      #
      # HERE RATHER THAN IN THE HYGIENE JOB, which is where it was first put and
      # where it went red: it builds the stats catalog, and the catalog needs
      # dplyr, readr and tidyr. The hygiene tier installs stringr and nothing
      # else, and adding the tidyverse to it to hold one check would stop it
      # being the cheap tier. This job already provisions all three.
      - name: Manuscript protected results (no typed literals)
        run: Rscript tests/ci_manuscript_numbers.R

      - name: Manuscript protected results (planted defects)
        run: Rscript tests/test_manuscript_numbers_detect.R

      # The R half of the microsimulation contract whose Python half runs in the
      # Python job above. Placed HERE because this is the job with an R
      # toolchain; needs only readr and jsonlite, both already in the list above.
      - name: Microsimulation cross-implementation agreement
        run: Rscript tests/test_run_midwifery_microsimulation.R

      # Data-driven: adding a hard case means adding a row to
      # tests/microsimulation_case_library.tsv, not writing a new test.
      - name: Microsimulation case library
        run: Rscript tests/test_microsimulation_case_library.R

      # Ten real NPPES schema/concurrency hazards found in a manual bug hunt
      # (2026-08-27) against build_midwife_panel.R: an accented name under an
      # ASCII header, a stray whitespace byte, a missing middle-name column, a
      # taxonomy code in a non-first slot, a lowercase taxonomy code, an
      # unrecognisable schema, two files claiming one year, a renamed-column
      # era, and both a stale and a genuinely live lock file. All ten passed
      # when this was promoted to a permanent test; nothing else in CI would
      # notice if a future change broke one.
      - name: Panel builder hardening (NPPES schema drift, lock safety)
        run: Rscript tests/test_build_midwife_panel.R

      # Semantic invariants ported from ~/isochrones/tests/testthat/, extended
      # with a real NPI Luhn check -- upstream validated only width and digits,
      # which accepts 1234567890. The arithmetic tests are hermetic; the ones
      # reading person-level artifacts SKIP here, because those files are
      # gitignored, and report as skips rather than passes.
      - name: Ported invariants (NPI check digit, geography, provenance)
        run: Rscript -e 'testthat::test_file("tests/test_invariants_midwifery.R", stop_on_failure = TRUE)'

      # -----------------------------------------------------------------------
      # The audit-cycle suites, wired in one at a time.
      #
      # tests/ holds 23 numbered cycles, most of which were written against a
      # working tree and were never runnable anywhere else. Each suite below was
      # re-run in a fresh clone of HEAD with HOME redirected -- so no
      # ~/isochrones and no gitignored artifact -- and kept only if it passed
      # AND asserted something: a suite that reports "SKIP: inputs absent" for
      # every case is a green tick that means nothing, and is worse than absent
      # because it looks like coverage.
      #
      # Deliberately NOT here, and why:
      #   cycle11_spatial, cycle14_coverage_surfaces  need sf. See the header.
      #   healthgrades_integrity                      skips wholesale; vacuous.
      #   cycle6_field_quality                        reads /tmp/c6_attrs.csv,
      #                                               a machine-local snapshot,
      #                                               and FAILS (not skips) when
      #                                               it is absent. Found by CI
      #                                               after a fresh-clone check
      #                                               passed: the clone
      #                                               redirected HOME but not
      #                                               /tmp, where a stale copy
      #                                               was still sitting.
      #   cycle9, cycle10, cycle18, cycle19, cycle22, cycle5_key_resolution,
      #   amcb_gates                                   fail in a fresh clone
      #                                               today -- recorded debt or
      #                                               absent inputs, not a
      #                                               regression this file can
      #                                               assert against.
      #   frozen_dependency  ADDED 2026-08-28, below. It used to belong on
      #                      this list -- T5 (declared REBUILD_ORDER set ==
      #                      discovered FROZEN-consumer set) failed on any
      #                      checkout, fresh or not, whenever a consumer script
      #                      existed that nobody had declared. That happened
      #                      three times (2026-08-10, -08-15, -08-28) and each
      #                      time sat undetected until the next Nightly run,
      #                      because this file was the only place a PR was
      #                      gated at all and it excluded exactly this test.
      #                      It needs only dplyr/readr/jsonlite, already
      #                      installed below, and costs ~1s.
      #   amcb_name_normalization, cycle12            need ~/isochrones.
      #   match_npi_to_hospitals                      downloads from CMS.
      # Do not add any of them without re-running the fresh-clone check first.
      # -----------------------------------------------------------------------

      # Dates, keys and denominators: the arithmetic under every rate the paper
      # reports. A denominator that silently changes cohort moves every percent.
      - name: Cycle 2-3 (dates, keys, denominators)
        run: |
          Rscript tests/test_cycle2_dates_keys.R
          Rscript tests/test_cycle3_denominators.R

      # Connecticut replaced counties with nine planning regions; every county
      # rate in the state depends on that apportionment being flagged, not
      # silently averaged.
      - name: Cycle 4 (Connecticut apportionment)
        run: Rscript tests/test_cycle4_ct_apportionment.R

      # Two rows that disagree about where one midwife is must not both survive
      # into a map. Field quality and units guard the same seam upstream.
      # cycle6 is NOT here: it reads /tmp/c6_attrs.csv, a machine-local
      # snapshot, and its absent-branch is chk(FALSE) -- a deliberate failure,
      # not a skip, because T68/T69 exist to prove FALSE means false rather than
      # a disguised absence. That evidence cannot be produced on a runner, and
      # weakening it to a skip would discard the point of the test. It stays a
      # local check. See the exclusion list above.
      - name: Cycle 5, 7-8 (geocode conflicts, units, filter bias)
        run: |
          Rscript tests/test_cycle5_geocode_conflicts.R
          Rscript tests/test_cycle7_units.R
          Rscript tests/test_cycle8_filter_bias.R

      # WONDER cohort definitions and the ACS variable/label pairing: a mislabelled
      # ACS variable is invisible in the artifact and wrong in the table.
      - name: Cycle 13, 16-17 (WONDER cohort, ACS variables and labels)
        run: |
          Rscript tests/test_cycle13_cohort_wonder.R
          Rscript tests/test_cycle16_acs_variables.R
          Rscript tests/test_cycle17_acs_labels.R

      # Congressional-district vintage, provenance wiring and coordinate
      # precision -- the three things a reader assumes without checking.
      - name: Cycle 20-21, 23 (congress vintage, provenance, geocode precision)
        run: |
          Rscript tests/test_cycle20_congress_vintage.R
          Rscript tests/test_cycle21_provenance_wiring.R
          Rscript tests/test_cycle23_geocode_precision.R

      # Birth activity decides who counts as a practising midwife; license
      # resolution decides which of several licenses is the one. Both are pure.
      - name: Birth activity and license resolution
        run: |
          Rscript tests/test_birth_activity.R
          Rscript tests/test_license_resolution.R

      # Type-2 (organisational) NPI resolution in bulk, the Table 1
      # Black/Hispanic banding, and PIP materialisation.
      - name: Open Payments type-2 bulk, Table 1 banding, PIP materialisation
        run: |
          Rscript tests/test_open_payments_type2_bulk.R
          Rscript tests/test_table1_blk_hg.R
          Rscript tests/test_pip_materialization.R

      # -----------------------------------------------------------------------
      # Ported verbatim from mufflyt/isochrones @ 1907a5c40 -- 416 assertions,
      # zero new code. Each file tests a helper that exists in BOTH repos, so
      # the upstream contract applies here unaltered and not one assertion was
      # edited. The hyphenated filenames mark them as ported; test_*.R is ours.
      #
      # A failure in these means the local helper has DRIFTED from a contract
      # someone else is still maintaining. Decide which side is right; do not
      # edit the assertion to match the code.
      #
      # Verified under the three-check protocol in the header before landing:
      # fresh clone with HOME redirected, every source() chain followed for
      # packages, and a grep for absolute paths outside the repo.
      # -----------------------------------------------------------------------

      # The safe-divide family: a zero or NA denominator must never become Inf,
      # NaN or a silent zero. Every rate in Table 1 and every per-1,000-births
      # figure on the county map goes through it.
      - name: Ported - safe_divide family (292 assertions)
        run: |
          Rscript -e 'testthat::test_file("tests/test-retraction-bugs-9-14.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-safe-divide-zero-threshold-bva.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-safe-percent-zero-default-family-bva.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-consort-audit-rounds-61-thru-65-2026-05-21.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-den-032-safe-pct-manu-na-semantics.R", stop_on_failure = TRUE)'

      # join_safety gates every join in the pipeline on coverage and duplication
      # bounds. JOIN_REPORT_DIR is set because one block exercises the DEFAULT
      # report path rather than overriding it, and would otherwise write into
      # tests/artifacts/ in the checkout.
      - name: Ported - join_safety (79 assertions)
        env:
          JOIN_REPORT_DIR: ${{ runner.temp }}/join_reports
        run: |
          mkdir -p "$JOIN_REPORT_DIR"
          Rscript -e 'testthat::test_file("tests/test-join-safety.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-join-safety-semantic-extended.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-step2-npi-dedup-bug.R", stop_on_failure = TRUE)'

      # resolve_tract_vintage.R is BYTE-IDENTICAL to upstream, so these two are
      # the strongest ports here: same code, same contract, no translation.
      - name: Ported - tract vintage resolution (45 assertions)
        run: |
          Rscript -e 'testthat::test_file("tests/test-tract-vintage-boundary-bva-2019-2020-2021.R", stop_on_failure = TRUE)'
          Rscript -e 'testthat::test_file("tests/test-step8-tract-vintage-routing.R", stop_on_failure = TRUE)'

      # -----------------------------------------------------------------------
      # Repository integrity gates. Eight checks, each written because the
      # corresponding failure actually happened -- most of them on the day this
      # was added. R/ci_repo_integrity_gates.R names the incident behind each.
      #
      # The gate-of-gates runs FIRST, deliberately. A checker with an inverted
      # condition or an over-broad allowance passes exactly like a clean
      # repository, and nobody watches a green checker. It plants one defect per
      # gate and asserts each is detected.
      # -----------------------------------------------------------------------
      - name: Integrity gates detect planted defects
        run: Rscript tests/test_repo_integrity_gates.R

      - name: Repository integrity gates
        run: Rscript tests/ci_repo_integrity.R

      # A script that reads amcb_npi_linkage_FROZEN.csv but is not declared in
      # rebuild_frozen_dependents.R's REBUILD_ORDER is invisible to a re-freeze:
      # it silently keeps the stale cohort while the rebuild reports success.
      # Three separate scripts have shipped this way (2026-08-10, -08-15,
      # -08-28), each caught only by the next Nightly run, hours or days after
      # merge. This is that same check, gating the PR instead.
      - name: FROZEN dependency completeness (T5)
        run: Rscript tests/test_frozen_dependency.R

  # ---------------------------------------------------------------------------
  # Path-filtered: the science-law suite (tests/ci_law_coverage.R) is Nightly's
  # job, not this file's -- it is expensive (the L8/L9 determinism harness runs
  # its own suite six times) and several of its gates need the geo stack this
  # file otherwise refuses. But "only Nightly checks it" is exactly how L5-L10
  # sat broken on main for two days: a PR that edits a registered gate, its
  # mutation harness, or the registry itself can silently desync coverage, and
  # nobody sees it until the next scheduled run.
  #
  # RELEVANCE IS COMPUTED FROM THE REGISTRY, NOT A SEPARATE PATH LIST. A
  # hardcoded `paths:` filter on the pull_request trigger would need to be
  # hand-kept in sync with tests/science_law_registry.tsv -- exactly the
  # prose-mirrors-data drift the registry exists to prevent (see its own
  # header: "THE MAPPING IS DATA, NOT PROSE"). This job instead reads the
  # registry at run time and diffs the changed files against its gate and
  # mutation columns, so a new law or a moved gate file is covered
  # automatically, with nothing here to fall out of sync.
  # ---------------------------------------------------------------------------
  science-law-coverage:
    name: Science-law coverage (path-filtered)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE JOB MUST SAY WHETHER IT DID THE WORK. Every law step below is gated on
    # steps.relevance.outputs.run, so when the filter takes the fast path this
    # job exits zero having evaluated nothing -- and a green tick is
    # indistinguishable from a 6m30s run that checked twelve laws. It was
    # indistinguishable, three times, on #99, #105 and #100. Exporting the
    # decision lets the aggregate gate refuse to call that scientifically green.
    outputs:
      executed: ${{ steps.relevance.outputs.run }}
    env:
      LAW_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails OPEN, not closed: no usable base ref (workflow_dispatch, a
      # force-push whose `before` is the all-zero SHA, a shallow-history edge
      # case) runs the check rather than silently skipping it. A skip is only
      # ever earned by proving the diff, never assumed by default.
      - name: Decide whether this change touches a registered law gate
        id: relevance
        run: |
          set -u
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base ref -- running the coverage check to be safe"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          registry="tests/science_law_registry.tsv"
          # $1 == "law" drops the HEADER ROW. NR>1 alone does not: comment lines
          # precede the header, so it survived and put the literal strings
          # "gate" and "mutation" into the relevant-path list as though they
          # were filenames. Harmless only because no such files exist.
          relevant=$(awk -F'\t' '!/^#/ && NF > 1 && $1 != "law" {print $3; print $4}' "$registry" | sort -u)
          # THE CHECKER MUST TRIGGER ON ITSELF. The list above holds the gates a
          # law is evaluated BY; it did not hold the gate that checks that the
          # laws were evaluated AT ALL, nor the harness proving that gate can
          # fail. So a change to tests/ci_law_coverage.R took the fast path and
          # reported success without running the thing it had just modified --
          # which is how a coverage fix landed with a green tick that had
          # verified nothing about it.
          relevant=$(printf '%s\n%s\n%s\n%s\n' "$relevant" "$registry" \
                            "tests/ci_law_coverage.R" "tests/test_law_coverage_detect.R")
          hit=$(comm -12 <(printf '%s\n' "$changed" | sort -u) <(printf '%s\n' "$relevant" | sort -u))
          # THE LIST ABOVE HOLDS THE FILES A LAW IS EVALUATED BY. It does not
          # hold the files a law READS, and since L12 those are not the same
          # set. L12 builds manuscript/R/build_stats_catalog.R and scans every
          # manuscript/*.qmd for a protected literal, so a pure prose edit can
          # fail it -- and PR #99 changed six manuscript files and took the fast
          # path, reporting a 6-second success that had verified nothing about
          # the law most likely to fire on it.
          #
          # Matched by pattern because these are directories and globs, not the
          # fixed filenames comm can compare. Erring toward running: a needless
          # 6-minute job is a cost, a green tick that checked nothing is a
          # defect.
          # This file is on the list, and finding that out cost a second round
          # trip: the pull request that FIXED this filter changed only
          # .github/workflows/ci.yml, so it took the fast path and reported an
          # 8-second success for a filter nobody had exercised. The workflow
          # that defines the law job is law-relevant by definition -- it decides
          # whether the laws run at all.
          inputs='^manuscript/R/|^manuscript/.*[.]qmd$|^artifacts/(linkage_selection_bounds|composition_rucc_cat|linkage_completeness_by_status)[.]csv$|^[.]github/workflows/(ci|nightly)[.]yml$'
          input_hit=$(printf '%s\n' "$changed" | grep -E "$inputs" || true)
          if [ -n "$input_hit" ]; then
            hit=$(printf '%s\n%s\n' "$hit" "$input_hit" | grep -v '^$' || true)
          fi
          if [ -n "$hit" ]; then
            echo "law-relevant file(s) changed:"
            echo "$hit"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no registered law-gate file changed in this diff."
            echo "This is the fast path, not a silent no-op: Nightly still runs the full"
            echo "law-coverage check every 24h regardless of what changed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.relevance.outputs.run == 'true'
        with:
          r-version: release
          use-public-rspm: true

      # sf needs the geo stack ci.yml otherwise refuses (see the file header).
      # Confined to this job, and only installed when the relevance check
      # above says it is actually needed.
      - name: System libraries for sf
        if: steps.relevance.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      # Exactly the packages L6-L10's gates need, mirrored from
      # nightly.yml's own install step for the same job -- see that file for
      # why installing them (rather than rewriting the gates to avoid them)
      # was the judgment call.
      - name: Install packages needed by L6-L10's gates
        if: steps.relevance.outputs.run == 'true'
        run: |
          # jsonlite and openssl found only by following source() chains and
          # pkg::fn() calls, not by grepping for library() at the top of the
          # gate files: test_cache_vintage_declared.R calls jsonlite::read_json
          # (a provenance sidecar) and, via R/lib/cache_vintage.R,
          # openssl::sha256(); test_deterministic_rebuild.R calls
          # openssl::sha256() itself. Confirmed the hard way -- the first
          # version of this list passed 8/10 laws and left L8/L10 failing with
          # "there is no package called 'openssl'" on this exact runner.
          # tidyr added 2026-08-29 for L12, which builds
          # manuscript/R/build_stats_catalog.R to compare the value the
          # manuscript renders against the artifacts it claims to come from.
          pkgs <- c("dplyr", "readr", "stringr", "readxl", "sf", "DBI", "duckdb",
                    "jsonlite", "openssl", "tidyr")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE))
            stop("package still unavailable after install: ", p)
        shell: Rscript {0}

      - name: Law coverage (every registered law was exercised)
        if: steps.relevance.outputs.run == 'true'
        run: Rscript tests/ci_law_coverage.R

  # ---------------------------------------------------------------------------
  # The single status branch protection should require.
  #
  # Every check above reports on itself, and a status that is green because a
  # job declined to run looks exactly like one that is green because a job
  # passed. This job is the difference. It runs with if: always() so that a
  # skipped or cancelled dependency still reaches it -- a gate that is itself
  # skipped when its subject is skipped protects nothing.
  #
  # Deliberately cheap: bash and jq, both already on the runner, no toolchain
  # and no data. It adds seconds to every pull request and is the only status
  # anyone needs to read.
  # ---------------------------------------------------------------------------
  scientific-gate:
    name: Scientific gate
    runs-on: ubuntu-latest
    if: always()
    needs: [r-checks, python-checks, r-unit-tests, science-law-coverage]
    steps:
      - uses: actions/checkout@v4

      - name: Every required component ran and succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Kept in step with the needs: list above by
          # tests/test_aggregate_gate.R, which parses this file and fails if a
          # job exists that neither list names. Adding a job and forgetting to
          # require it is the quiet way to lose coverage.
          REQUIRED: "r-checks python-checks r-unit-tests science-law-coverage"
        run: bash tests/ci_aggregate_gate.sh
