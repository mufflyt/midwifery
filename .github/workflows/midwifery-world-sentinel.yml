# =============================================================================
# Midwifery External-World Sentinel CI Workflow
# =============================================================================
# Read-only external-world monitoring system for the midwifery dataset.
# Detects when AMCB, NPPES, provider facts, addresses, or Census Geocoder shift.
#
# Outcome classification:
#   PASS             Compatible with governed expectations.
#   WORLD_DRIFT      External fact changed (reported, non-failing info/warning).
#   PIPELINE_FAILURE Software/matcher defect or parser error (exits non-zero).
#
# SAFETY GUARANTEE: Read-only. NEVER modifies production datasets or frozen cohorts.
# =============================================================================
name: Midwifery External-World Sentinel

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      subsystem:
        description: 'Subsystem to evaluate (all, amcb, identity, geocoding)'
        required: true
        default: 'all'

concurrency:
  group: sentinel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sentinel:
    name: External-world drift & source-health sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-sentinel-${{ hashFiles('.github/workflows/midwifery-world-sentinel.yml') }}
          restore-keys: ${{ runner.os }}-r-sentinel-

      - name: Cache APT packages for sf
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-sf-${{ hashFiles('.github/workflows/midwifery-world-sentinel.yml') }}
          restore-keys: ${{ runner.os }}-apt-sf-

      - name: System libraries for sf
        run: |
          if dpkg -s libgdal-dev libproj-dev libgeos-dev libudunits2-dev >/dev/null 2>&1; then
            echo "sf system libraries already installed."
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libgdal-dev libproj-dev libgeos-dev libudunits2-dev
          fi
          sudo chown -R $USER /var/cache/apt/archives || true

      - name: Install dependencies
        run: |
          pkgs <- c("dplyr", "readr", "jsonlite", "openssl", "tibble", "stringr")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing)) install.packages(missing)
        shell: Rscript {0}

      - name: Run sentinel framework & classification engine
        run: Rscript scripts/nightly/run_nightly.R

      - name: Validate Draft 2020-12 JSON schemas
        run: python3 scripts/nightly/validate_schema.py artifacts/nightly/

      - name: Upload Sentinel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midwifery-sentinel-report
          path: |
            artifacts/nightly/run_manifest.json
            artifacts/nightly/sentinel_summary.json
            artifacts/nightly/sentinel_events.csv
            artifacts/nightly/sentinel_events.jsonl
            artifacts/nightly/nightly_report.md
          retention-days: 14
          if-no-files-found: ignore
